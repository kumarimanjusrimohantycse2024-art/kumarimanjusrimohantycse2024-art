<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Manjusri Mohanty developer portfolio banner</title>
  <desc id="desc">A midnight gradient with electric purple and cyan geometry for Manjusri Mohanty.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B16"/>
      <stop offset="0.52" stop-color="#0D1224"/>
      <stop offset="1" stop-color="#111A36"/>
    </linearGradient>
    <linearGradient id="glow" x1="210" y1="45" x2="1310" y2="485" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B5CFF"/>
      <stop offset="0.5" stop-color="#388BFF"/>
      <stop offset="1" stop-color="#42E8FF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(1190 140) rotate(126) scale(520 590)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B5CFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#9B5CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#8CA3C7" stroke-opacity="0.1"/>
      <circle cx="1" cy="1" r="1.5" fill="#42E8FF" fill-opacity="0.32"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1600" height="560" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="24" fill="url(#halo)"/>
  <rect width="1600" height="560" rx="24" fill="url(#grid)"/>
  <ellipse cx="1270" cy="108" rx="230" ry="116" fill="#9B5CFF" fill-opacity="0.2" filter="url(#blur)">
    <animate attributeName="opacity" values="0.35;0.7;0.35" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M1050 0L1600 0V560H1270L1050 0Z" fill="#080B16" fill-opacity="0.3"/>
  <path d="M1070 560L1600 72" stroke="url(#glow)" stroke-opacity="0.46" stroke-width="2"/>
  <path d="M1130 560L1600 126" stroke="#42E8FF" stroke-opacity="0.18"/>
  <path d="M1190 560L1600 182" stroke="#9B5CFF" stroke-opacity="0.22"/>
  <g opacity="0.8">
    <circle cx="1280" cy="152" r="84" stroke="#388BFF" stroke-opacity="0.46"/>
    <circle cx="1280" cy="152" r="122" stroke="#9B5CFF" stroke-opacity="0.3" stroke-dasharray="5 14">
      <animateTransform attributeName="transform" type="rotate" from="0 1280 152" to="360 1280 152" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1280" cy="152" r="6" fill="#42E8FF" filter="url(#soft)">
      <animate attributeName="r" values="5;10;5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#42E8FF" opacity="0.72">
    <circle cx="1080" cy="112" r="3"/><circle cx="1450" cy="284" r="3"/><circle cx="1240" cy="382" r="2"/><circle cx="1500" cy="76" r="2"/>
  </g>
  <path d="M104 108H270" stroke="#42E8FF" stroke-width="2"/>
  <path d="M104 108V148" stroke="#42E8FF" stroke-width="2"/>
  <path d="M104 148H156" stroke="#9B5CFF" stroke-width="2"/>
  <text x="104" y="208" fill="#42E8FF" font-family="monospace" font-size="18" letter-spacing="4">SOFTWARE ENGINEER / AI ENTHUSIAST</text>
  <text x="100" y="316" fill="#F8FAFC" font-family="Georgia, serif" font-size="74" font-weight="700" letter-spacing="2">MANJUSRI</text>
  <text x="100" y="398" fill="#F8FAFC" font-family="Georgia, serif" font-size="74" font-weight="700" letter-spacing="2">MOHANTY</text>
  <rect x="104" y="442" width="74" height="4" rx="2" fill="url(#glow)"/>
  <text x="200" y="447" fill="#D6E4FF" font-family="monospace" font-size="18" letter-spacing="1">Building intelligent solutions. Exploring beyond boundaries.</text>
  <text x="104" y="505" fill="#8CA3C7" font-family="monospace" font-size="14" letter-spacing="2">SOFTWARE ENGINEERING  //  ARTIFICIAL INTELLIGENCE  //  BACKEND  //  DSA</text>
  <rect x="1" y="1" width="1598" height="558" rx="23" stroke="#334A75" stroke-opacity="0.8" stroke-width="2"/>
</svg>
