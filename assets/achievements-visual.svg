<svg width="1600" height="860" viewBox="0 0 1600 860" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Achievement signals</title>
  <desc id="desc">Singularity selected among the top 20 of 765 teams, Elan Greek D selected in the top 10 teams, Tensor X third place, and YC Fall organized by AI House and HiDevs.</desc>
  <defs>
