<svg width="900" height="180" viewBox="0 0 900 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub contribution streak refresh</title>
  <desc id="desc">The live streak card will be generated automatically by GitHub Actions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="900" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#11182A"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="900" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A855F7"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="898" height="178" rx="20" fill="url(#background)" stroke="url(#edge)" stroke-opacity=".6" stroke-width="2"/>
  <circle cx="56" cy="58" r="5" fill="#00E5FF"/>
  <text x="76" y="64" fill="#00E5FF" font-family="monospace" font-size="16" font-weight="700" letter-spacing="3">GITHUB CONTRIBUTION STREAK</text>
  <text x="56" y="116" fill="#F4F4FF" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Auto-refresh is enabled</text>
  <text x="58" y="148" fill="#9295B5" font-family="monospace" font-size="13" letter-spacing="1">LIVE STATS WILL APPEAR AFTER THE FIRST WORKFLOW RUN</text>
  <rect x="712" y="42" width="136" height="42" rx="21" fill="#121F35" stroke="#303A64"/>
  <circle cx="735" cy="63" r="5" fill="#A855F7"/>
  <text x="750" y="68" fill="#C5C9DE" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1">EVERY 15 MIN</text>
</svg>
