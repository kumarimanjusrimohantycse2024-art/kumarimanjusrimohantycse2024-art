name: Refresh GitHub streak card

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/github-streak.svg"

permissions:
  contents: write

concurrency:
  group: github-streak-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: >-
            user=${{ github.repository_owner }}&hide_border=true&background=070711&stroke=303A64&ring=A855F7&fire=00E5FF&currStreakLabel=00E5FF&sideLabels=F4F4FF&dates=9295B5
          path: assets/github-streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}
      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-streak.svg
          if git diff --cached --quiet; then
            echo "Streak card is unchanged."
            exit 0
          fi
          git commit -m "Update GitHub streak card"
          git push
